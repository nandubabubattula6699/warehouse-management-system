<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Label • Warehouse OS</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
    .toolbar { padding: 16px; text-align: center; }
    .toolbar button, .toolbar a { font-size: 16px; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 0; background: #1e3a8a; color: #fff; cursor: pointer; text-decoration: none; margin: 0 4px; display: inline-block; }
    .label { width: 4in; margin: 0 auto 24px; background: #fff; border: 3px solid #0f172a; border-radius: 14px; padding: 18px; text-align: center; }
    .brand { font-size: 14px; font-weight: 900; letter-spacing: .2em; }
    .loc { font-size: 34px; font-weight: 900; margin: 6px 0 2px; }
    .levels { font-size: 14px; font-weight: 700; color: #334155; }
    .label img { width: 3in; height: 3in; display: block; margin: 12px auto; image-rendering: pixelated; }
    .instr { font-size: 13px; font-weight: 600; color: #334155; }
    .code { font-family: ui-monospace, monospace; font-size: 12px; color: #64748b; margin-top: 6px; word-break: break-all; }
    @media print { .toolbar { display: none; } body { background: #fff; } .label { margin-top: 0; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨 Print label</button>
    <a id="pngLink" download>⬇ Download PNG</a>
    <a id="testLink" target="_blank">Test scan page</a>
  </div>
  <div class="label">
    <div class="brand" id="brand">ALLBIRDS</div>
    <div class="loc" id="loc">Loading…</div>
    <div class="levels" id="levels"></div>
    <img id="qr" alt="QR code" style="visibility:hidden" onload="this.style.visibility='visible'" />
    <div class="instr">Scan when you take pieces from ANY level of this section</div>
    <div class="code" id="url"></div>
  </div>
<script>
  const code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
  fetch(`/pick/api/s/${encodeURIComponent(code)}`, { credentials: "same-origin" })
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { document.body.innerHTML = `<p style="padding:24px">${d.detail || "Error"}</p>`; return; }
      const s = d.station;
      document.getElementById("brand").textContent = s.brand;
      document.getElementById("loc").textContent = `LINE ${s.line} · SEC ${s.section}`;
      document.getElementById("levels").textContent = `Levels ${s.levels.join(" · ")}  —  mount on Level ${s.qr_mounted_on_level}`;
      document.getElementById("url").textContent = d.scan_url;
      const png = `/pick/qr/${encodeURIComponent(code)}.png?scale=16`;
      document.getElementById("qr").src = png;
      const dl = document.getElementById("pngLink"); dl.href = png; dl.download = `QR-${code}.png`;
      document.getElementById("testLink").href = `/pick/s/${encodeURIComponent(code)}`;
    });
</script>
</body>
</html>
