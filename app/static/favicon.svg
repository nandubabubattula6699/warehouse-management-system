<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173456" />
      <stop offset="60%" stop-color="#0f2640" />
      <stop offset="100%" stop-color="#091829" />
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00a0f5" />
      <stop offset="100%" stop-color="#0070ba" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0070ba" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0070ba" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- High-end Rounded Badge -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Inner Subtle Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="94" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" />

  <!-- Stylized Industrial "A" Icon for Alexander Warehouse -->
  <g filter="url(#glow)">
    <!-- Apex & Legs of the "A" -->
    <path d="M 256 86 L 404 416 L 332 416 L 294 328 L 218 328 L 180 416 L 108 416 Z M 256 196 L 232 272 L 280 272 Z" 
          fill="url(#aGrad)" />

    <!-- Pure White Central Peak Highlight -->
    <polygon points="256,86 280,144 232,144" fill="#ffffff" opacity="0.95" />

    <!-- Modern Alexander Diamond Core Accent in Center Crossbar -->
    <polygon points="256,236 270,254 256,272 242,254" fill="#ffffff" />
  </g>

  <!-- Alexander Cyan Status Dot -->
  <circle cx="256" cy="446" r="10" fill="#38bdf8" />
</svg>