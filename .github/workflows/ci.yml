name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throw-away CI database only. The tests refuse any host but localhost and any DB name not ending in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/warehouse_test
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            services/picking-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format github .

      - name: Migrations (fresh DB -> head -> models match -> down -> up)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/warehouse_ci_test
        run: |
          createdb -h localhost -U postgres warehouse_ci_test
          alembic upgrade head
          alembic check
          alembic downgrade 0001
          alembic upgrade head
          alembic current

      - name: Tests (main app)
        run: python -m pytest

      - name: Tests (picking-service)
        working-directory: services/picking-service
        run: python -m pytest
